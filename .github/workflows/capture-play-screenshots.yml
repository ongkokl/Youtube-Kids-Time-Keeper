name: Capture Play Store Screenshots

on:
  workflow_dispatch:
  push:
    branches: [ play-screenshots-api35 ]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.parentguard.youtubetimerguard android.permission.POST_NOTIFICATIONS || true
            adb shell appops set com.parentguard.youtubetimerguard GET_USAGE_STATS allow || true
            adb shell appops set com.parentguard.youtubetimerguard SYSTEM_ALERT_WINDOW allow || true
            adb shell appops set com.parentguard.youtubetimerguard android:system_alert_window allow || true
            adb shell am start -n com.parentguard.youtubetimerguard/.MainActivity
            sleep 3
            adb exec-out screencap -p > screenshots/01-main-screen.png
            adb shell am start-foreground-service -n com.parentguard.youtubetimerguard/.MonitorService -a com.parentguard.youtubetimerguard.TEST_LOCKOUT
            sleep 3
            adb exec-out screencap -p > screenshots/02-break-countdown.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeGuard-v0.2.1-play-screenshots
          path: screenshots/*.png
