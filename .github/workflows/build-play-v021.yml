name: Build Play Store v0.2.1 Bundle

on:
  push:
    branches: [ play-store-v021 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release bundle
        run: gradle :app:bundleRelease --stacktrace

      - name: Build release APK for QA
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload unsigned Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeGuard-v0.2.1-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeGuard-v0.2.1-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
