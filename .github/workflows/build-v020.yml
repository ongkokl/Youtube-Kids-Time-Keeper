name: Build YouTube Timer Guard v0.2.0 APK

on:
  push:
    branches: [ play-safe-break-v020 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeTimerGuard-v0.2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Android signing tools
        shell: bash
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/$BUILD_TOOLS/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: signing-tools
