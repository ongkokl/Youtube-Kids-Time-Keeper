name: Build YouTube Timer Guard v0.1.4 APK

on:
  push:
    branches: [ apk-v014-final ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore launcher icon
        shell: bash
        env:
          ICON_B64: 
        run: |
          mkdir -p app/src/main/res/drawable
          printf '%s' "$ICON_B64" | base64 -d > app/src/main/res/drawable/kid_icon.webp

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeTimerGuard-v0.1.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
