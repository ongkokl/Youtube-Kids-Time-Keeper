name: Build Screen Time Guard v0.2.3

on:
  push:
    branches: [ v023-icon-install-fix ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct validated launcher icon
        shell: bash
        run: |
          cat icon_parts/kid_safe_icon.part1.b64               icon_parts/kid_safe_icon.part2.b64               icon_parts/kid_safe_icon.part3.b64 > /tmp/kid_safe_icon.b64
          base64 -d /tmp/kid_safe_icon.b64 > app/src/main/res/drawable/kid_safe_icon_v022.webp
          test "$(stat -c%s app/src/main/res/drawable/kid_safe_icon_v022.webp)" -eq 8126
          echo "62a061ce57ff933aa4f8f651f9e90851811f3810c0c329ed7da00898903912f9  app/src/main/res/drawable/kid_safe_icon_v022.webp" | sha256sum -c -

      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeGuard-v0.2.3-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeGuard-v0.2.3-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
