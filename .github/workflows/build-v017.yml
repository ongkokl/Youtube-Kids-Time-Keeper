name: Build YouTube Timer Guard v0.1.7 Release

on:
  push:
    branches: [ lockout-countdown-v017 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeTimerGuard-v0.1.7-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk


      - name: Export Android signing tools
        shell: bash
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/$BUILD_TOOLS/lib/apksigner.jar" signing-tools/lib/
          cp "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" signing-tools/
          echo "$BUILD_TOOLS" > signing-tools/version.txt

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: signing-tools
